name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Checkout go-gui
        uses: actions/checkout@v6
        with:
          repository: go-gui-org/go-gui
          path: go-gui
          ref: v0.59.0

      - name: Checkout go-glyph
        uses: actions/checkout@v6
        with:
          repository: go-gui-org/go-glyph
          path: go-glyph
          ref: v1.20.0

      - name: Update go.mod replace directives
        run: |
          go mod edit -replace github.com/go-gui-org/go-gui=./go-gui
          go mod edit -replace github.com/go-gui-org/go-glyph=./go-glyph

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libfreetype6-dev libharfbuzz-dev libpango1.0-dev libfontconfig1-dev libhunspell-dev

      - name: Install MSYS2 and dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-pango
            mingw-w64-ucrt-x86_64-fontconfig
            mingw-w64-ucrt-x86_64-hunspell

      - name: Set CGo environment (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"
          echo "CC=$(cygpath -m $(which gcc))" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(cygpath -m /ucrt64/lib/pkgconfig)" >> "$GITHUB_ENV"
          cygpath -m /ucrt64/bin >> "$GITHUB_PATH"

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
