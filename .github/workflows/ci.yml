name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only. Nothing here publishes, comments or tags, so the job token
# needs no more than the checkout.
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    # go-charts contains no cgo: no file in the module declares `import
    # "C"` or a #cgo directive. It draws through go-gui and lays out text
    # through go-glyph, and both are pure Go on Linux and Windows --
    # go-gui reaches GL via purego and go-glyph shapes with
    # go-text/typesetting. Setting this explicitly keeps the two runners
    # honest: Windows has no C compiler here, and a silent fallback would
    # hide the day a dependency starts wanting one.
    env:
      CGO_ENABLED: "0"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Checkout go-gui
        uses: actions/checkout@v6
        with:
          repository: go-gui-org/go-gui
          path: go-gui
          ref: v0.75.0
      - name: Checkout go-glyph
        uses: actions/checkout@v6
        with:
          repository: go-gui-org/go-glyph
          path: go-glyph
          ref: v1.25.1

      - name: Update go.mod replace directives
        run: |
          go mod edit -replace github.com/go-gui-org/go-gui=./go-gui
          go mod edit -replace github.com/go-gui-org/go-glyph=./go-glyph

      # No apt or msys2 step. The SDL2, FreeType, HarfBuzz, Pango,
      # fontconfig and hunspell packages installed here until now were
      # left over from go-glyph's cgo era; nothing in this repo, or in
      # the versions pinned above, links any of them.
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          # Kept equal to the Makefile's LINT_VERSION, which `make lint-pin`
          # enforces locally, so a local lint pass and a CI lint pass mean
          # the same thing. Matches go-glyph and go-term.
          version: v2.12.2
