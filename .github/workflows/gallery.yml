name: Gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Checkout go-gui
        uses: actions/checkout@v6
        with:
          repository: go-gui-org/go-gui
          path: go-gui
          ref: v0.34.0

      - name: Checkout go-glyph
        uses: actions/checkout@v6
        with:
          repository: go-gui-org/go-glyph
          path: go-glyph
          ref: v1.16.2

      - name: Update go.mod replace directives
        run: |
          go mod edit -replace github.com/go-gui-org/go-gui=./go-gui
          go mod edit -replace github.com/go-gui-org/go-glyph=./go-glyph

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libfreetype6-dev libharfbuzz-dev libpango1.0-dev libfontconfig1-dev libhunspell-dev libegl1-mesa-dev libgl1-mesa-dev xvfb

      - name: Generate gallery
        run: xvfb-run --auto-servernum go run -tags gallery ./examples/showcase -out site/gallery

      - name: Landing page
        run: |
          cat > site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8">
          <title>go-charts</title>
          <meta http-equiv="refresh" content="0; url=gallery/">
          <a href="gallery/">go-charts gallery</a>
          EOF

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
